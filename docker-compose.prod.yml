version: '3.8'

# ═══════════════════════════════════════
# AI法律助手 v2.0 — 阿里云生产部署
# 技术栈: Python FastAPI + MongoDB + RAGFlow + LangChain
# 启动: docker compose -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════

services:

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== 前端 SSR (Python FastAPI + Jinja2) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://backend:8080
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== Python FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - RAGFLOW_BASE_URL=http://ragflow:9380
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== MongoDB 7 ==========
  mongodb:
    image: mongo:7
    expose:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: ai_law
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== RAGFlow 知识库引擎 ==========
  ragflow:
    image: infiniflow/ragflow:v0.15.0
    expose:
      - "9380"
    environment:
      RAGFLOW_DATABASE_URL: mongodb://mongodb:27017/ragflow
    volumes:
      - ragflow_data:/ragflow/data
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    networks:
      - ai-law-net

volumes:
  mongodata:
  ragflow_data:
  nginx_logs:

networks:
  ai-law-net:
    driver: bridge
