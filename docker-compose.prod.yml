version: '3.8'

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ai-law-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://backend:8080
    restart: unless-stopped
    networks:
      - ai-law-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - RAGFLOW_BASE_URL=http://docker-ragflow-cpu-1:9380
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-law-net
      - docker_ragflow

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: ai_law
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-law-net

volumes:
  mongodata:
  nginx_logs:

networks:
  ai-law-net:
    driver: bridge
  docker_ragflow:
    external: true
