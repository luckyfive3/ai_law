version: '3.8'

# ═══════════════════════════════════════
# AI法律助手 v2.0 — 开发环境
# 启动: docker compose up -d
# 停止: docker compose down
# ═══════════════════════════════════════

services:

  # ========== Python FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - RAGFLOW_BASE_URL=http://ragflow:9380
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== MongoDB 7 ==========
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_law
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-law-net

  # ========== RAGFlow 知识库引擎 ==========
  ragflow:
    image: infiniflow/ragflow:v0.15.0
    ports:
      - "9380:9380"
    environment:
      RAGFLOW_DATABASE_URL: mongodb://mongodb:27017/ragflow
    volumes:
      - ragflow_data:/ragflow/data
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - ai-law-net

volumes:
  mongodata:
  ragflow_data:

networks:
  ai-law-net:
    driver: bridge
