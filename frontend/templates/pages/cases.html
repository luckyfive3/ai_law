{% extends 'base.html' %}
{% block title %}案件管理 - AI法律助手{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/css/cases.css">
{% endblock %}

{% block content %}
<div class="cases-container">
  <div class="cases-header">
    <h1>案件管理</h1>
    <button class="btn btn-primary" id="newCaseBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      新建案件
    </button>
  </div>

  <div class="cases-toolbar">
    <input type="text" class="search-input" id="caseSearch" placeholder="搜索案件名称...">
    <select id="statusFilter">
      <option value="">全部状态</option>
      <option value="待分析">待分析</option>
      <option value="分析中">分析中</option>
      <option value="已分析">已分析</option>
    </select>
  </div>

  <div class="cases-grid" id="casesGrid">
    <div class="loading-skeleton">
      <div class="skeleton-card"><div class="skeleton-line w60 h24"></div><div class="skeleton-line w40 h12"></div><div class="skeleton-line w80 h8"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w60 h24"></div><div class="skeleton-line w40 h12"></div><div class="skeleton-line w80 h8"></div></div>
      <div class="skeleton-card"><div class="skeleton-card"><div class="skeleton-line w60 h24"></div><div class="skeleton-line w40 h12"></div><div class="skeleton-line w80 h8"></div></div>
    </div>
  </div>

  <div class="pagination" id="casesPagination"></div>
</div>

<!-- 新建案件弹窗 -->
<div class="modal-overlay" id="createCaseModal" style="display:none;">
  <div class="modal" style="max-width: 520px;">
    <h3>新建案件</h3>
    <form id="createCaseForm">
      <div class="form-group">
        <label>案件名称 <span style="color:var(--color-accent-red);">*</span></label>
        <input type="text" class="input" id="newCaseTitle" placeholder="请输入案件名称" required>
      </div>
      <div class="form-group">
        <label>案件类型</label>
        <select id="newCaseType">
          <option value="civil">民事</option><option value="criminal">刑事</option>
          <option value="administrative">行政</option><option value="commercial">商事</option>
          <option value="labor">劳动</option><option value="other">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>案件描述</label>
        <textarea id="newCaseDescription" class="input" rows="3" placeholder="请输入案件简要描述"></textarea>
      </div>
      <div class="form-group">
        <label>法院级别</label>
        <select id="newCaseCourt">
          <option value="">请选择</option>
          <option value="basic">基层法院</option><option value="intermediate">中级法院</option>
          <option value="high">高级法院</option><option value="supreme">最高法院</option>
        </select>
      </div>
      <div class="form-group">
        <label>标签</label>
        <div class="tags-input-wrapper" id="tagsInputWrapper">
          <input type="text" id="tagsInput" placeholder="输入标签后按回车">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="closeCreateModal">取消</button>
        <button type="submit" class="btn btn-primary" id="createCaseSubmit">确认创建</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/cases.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (Auth.isLoggedIn()) {
    CaseApp.init();
  } else {
    window.location.href = '/login?redirect=' + encodeURIComponent('/cases');
  }
});
</script>
{% endblock %}
