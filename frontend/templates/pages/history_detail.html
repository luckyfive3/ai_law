{% extends 'base.html' %}
{% block title %}会话详情 — AI法律助手{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto; padding: 0 var(--space-6); min-height: calc(100vh - var(--header-height));">

  <!-- 顶部信息栏 -->
  <div style="position:sticky;top:var(--header-height);z-index:50;background:var(--color-gray-50);padding:var(--space-4) 0;border-bottom:1px solid var(--color-gray-200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);">
    <div>
      <a href="/history" style="font-size:var(--text-sm);color:var(--color-gray-500);">
        ← 返回历史记录
      </a>
      <div id="detailInfo" style="font-weight:500;margin-top:var(--space-1);">
        加载中…
      </div>
    </div>
    <div style="display:flex;gap:var(--space-2);">
      <button id="continueChatBtn" class="btn btn-outline btn-sm">继续咨询</button>
      <button id="exportBtn" class="btn btn-outline btn-sm">导出</button>
      <button id="deleteSessionBtn" class="btn btn-danger btn-sm">删除</button>
    </div>
  </div>

  <!-- 消息列表 -->
  <div id="messageList" class="message-list" style="padding-bottom:var(--space-16);">
    <div style="text-align:center;padding:var(--space-12);">
      <div class="spinner"></div>
      <p style="font-size:var(--text-sm);color:var(--color-gray-500);margin-top:var(--space-3);">加载中…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  HistoryDetail.init({{ session_id | tojson }});
});
</script>
{% endblock %}
