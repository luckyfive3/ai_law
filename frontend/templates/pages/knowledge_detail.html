{% extends 'base.html' %}
{% block title %}法条详情 — AI法律助手{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-12); max-width: 800px;">

  <!-- 返回 + 面包屑 -->
  <a href="/knowledge" style="font-size: var(--text-sm); color: var(--color-gray-500); display: inline-block; margin-bottom: var(--space-4);">
    ← 返回知识库
  </a>

  <!-- 法条内容区域 -->
  <div id="lawDetail">
    <div style="text-align:center;padding:var(--space-16);">
      <div class="spinner"></div>
      <p style="font-size:var(--text-sm);color:var(--color-gray-500);margin-top:var(--space-3);">加载中…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const lawId = '{{ law_id }}';
  const container = document.getElementById('lawDetail');

  async function loadDetail() {
    try {
      const resp = await Api.get(`knowledge/laws/${lawId}`);
      const lawData = resp.data;
      if (!lawData || !lawData.chunks) throw new Error('无数据');

      renderDetail(lawData);
    } catch (e) {
      container.innerHTML = `
        <div class="empty-state" style="display:flex;">
          <div class="icon">📚</div>
          <div class="title">未找到该文档</div>
          <div class="desc">该文档可能尚未解析完成，请返回知识库</div>
        </div>`;
    }
  }

  function renderDetail(lawData) {
    const chunks = lawData.chunks || [];
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get('q') || '';

    container.innerHTML = `
      <h1 style="font-size: var(--text-2xl); font-weight: 700; margin-bottom: var(--space-2);">
        ${escapeHtml(lawData.name)}
      </h1>
      <p style="font-size: var(--text-sm); color: var(--color-gray-500); margin-bottom: var(--space-4);">
        ${escapeHtml(lawData.year || '')} · 共 ${chunks.length} 个知识块
      </p>

      <div class="search-box" style="margin-bottom: var(--space-6);">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </span>
        <input id="articleSearch" class="input" type="text"
          placeholder="搜索文本内容…" autocomplete="off" value="${escapeHtml(searchQuery)}"/>
      </div>

      <div id="articleSearchInfo" class="search-stats" style="display:none;"></div>

      <div style="background:#fff;border:1px solid var(--color-gray-200);border-radius:var(--radius-xl);overflow:hidden;" id="articlesContainer">
        ${chunks.map((c, idx) => `
          <div class="article-block" data-chunk-idx="${idx}" style="padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-gray-100);">
            <div style="font-weight: 600; color: var(--color-primary-700); margin-bottom: var(--space-2); font-size: var(--text-xs);">
              知识块 #${idx + 1}
            </div>
            <p class="article-content" style="font-size: var(--text-sm); color: var(--color-gray-700); line-height: 1.8;">${escapeHtml(c.content)}</p>
          </div>
        `).join('')}
      </div>
    `;

    // 页内搜索
    const articleSearch = document.getElementById('articleSearch');
    const articleSearchInfo = document.getElementById('articleSearchInfo');
    const articlesContainer = document.getElementById('articlesContainer');
    let articleSearchTimeout = null;

    function highlightArticleText(text, query) {
      if (!query) return escapeHtml(text);
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return escapeHtml(text).replace(regex, '<mark class="highlight">$1</mark>');
    }

    function filterArticles() {
      const query = articleSearch.value.trim().toLowerCase();
      const allBlocks = articlesContainer.querySelectorAll('.article-block');
      let matchCount = 0;

      allBlocks.forEach(block => {
        const idx = parseInt(block.dataset.chunkIdx);
        const originalContent = chunks[idx] ? chunks[idx].content : '';
        const contentEl = block.querySelector('.article-content');

        if (!query) {
          block.style.display = '';
          if (contentEl) contentEl.innerHTML = escapeHtml(originalContent);
          return;
        }

        if (originalContent.toLowerCase().includes(query)) {
          block.style.display = '';
          contentEl.innerHTML = highlightArticleText(originalContent, query);
          matchCount++;
        } else {
          block.style.display = 'none';
        }
      });

      if (query) {
        articleSearchInfo.style.display = 'block';
        articleSearchInfo.textContent = matchCount > 0
          ? `找到 ${matchCount} 条匹配内容`
          : '未找到匹配内容';
      } else {
        articleSearchInfo.style.display = 'none';
      }
    }

    articleSearch.addEventListener('input', () => {
      clearTimeout(articleSearchTimeout);
      articleSearchTimeout = setTimeout(filterArticles, 200);
    });

    if (searchQuery) filterArticles();
  }

  loadDetail();
});
</script>
{% endblock %}
