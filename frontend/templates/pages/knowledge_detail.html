{% extends 'base.html' %}
{% block title %}法条详情 — AI法律助手{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-12); max-width: 800px;">

  <!-- 返回 + 面包屑 -->
  <a href="/knowledge" style="font-size: var(--text-sm); color: var(--color-gray-500); display: inline-block; margin-bottom: var(--space-6);">
    ← 返回知识库
  </a>

  <!-- 法条内容区域 -->
  <div id="lawDetail">
    <div style="text-align:center;padding:var(--space-16);">
      <div class="spinner"></div>
      <p style="font-size:var(--text-sm);color:var(--color-gray-500);margin-top:var(--space-3);">加载中…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const lawId = '{{ law_id }}';

  // 模拟法条数据（实际从后端 API 获取）
  const lawData = {
    title: '中华人民共和国民法典',
    year: '2020年5月28日颁布，2021年1月1日施行',
    articles: [
      { num: '第一条', content: '为了保护民事主体的合法权益，调整民事关系，维护社会和经济秩序，适应中国特色社会主义发展要求，弘扬社会主义核心价值观，根据宪法，制定本法。' },
      { num: '第二条', content: '民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。' },
      { num: '第三条', content: '民事主体的人身权利、财产权利以及其他合法权益受法律保护，任何组织或者个人不得侵犯。' },
      { num: '第四条', content: '民事主体在民事活动中的法律地位一律平等。' },
      { num: '第五条', content: '民事主体从事民事活动，应当遵循自愿原则，按照自己的意思设立、变更、终止民事法律关系。' },
      { num: '第六条', content: '民事主体从事民事活动，应当遵循公平原则，合理确定各方的权利和义务。' },
      { num: '第七条', content: '民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。' },
      { num: '第八条', content: '民事主体从事民事活动，不得违反法律，不得违背公序良俗。' },
    ],
  };

  const container = document.getElementById('lawDetail');

  container.innerHTML = `
    <h1 style="font-size: var(--text-2xl); font-weight: 700; margin-bottom: var(--space-2);">
      ${escapeHtml(lawData.title)}
    </h1>
    <p style="font-size: var(--text-sm); color: var(--color-gray-500); margin-bottom: var(--space-8);">
      ${escapeHtml(lawData.year)}
    </p>

    <div style="background:#fff;border:1px solid var(--color-gray-200);border-radius:var(--radius-xl);overflow:hidden;">
      ${lawData.articles.map(a => `
        <div id="article-${a.num}" style="padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-gray-100); transition: background var(--transition-fast);">
          <div style="font-weight: 600; color: var(--color-primary-700); margin-bottom: var(--space-2); font-size: var(--text-sm);">
            第${escapeHtml(a.num)}条
          </div>
          <p style="font-size: var(--text-sm); color: var(--color-gray-700); line-height: 1.8;">${escapeHtml(a.content)}</p>
        </div>
      `).join('')}
    </div>
  `;
});
</script>
{% endblock %}
