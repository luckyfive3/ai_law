{% extends 'base.html' %}
{% block title %}法律知识库 — AI法律助手{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-12); max-width: 900px;">

  <h1 style="font-size: var(--text-2xl); font-weight: 600; margin-bottom: var(--space-6);">法律知识库</h1>

  <!-- 搜索框 + 提示 -->
  <div class="search-box">
    <span class="search-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </span>
    <input
      id="knowledgeSearch"
      class="input"
      type="text"
      placeholder="搜索法律法规名称或法条关键词，如"劳动合同"、"正当防卫"…"
      autocomplete="off"
    />
    <!-- 清除按钮 -->
    <button id="searchClear" class="search-clear" style="display:none;" title="清除搜索">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- 分类选项卡 -->
  <div class="knowledge-tabs" id="knowledgeTabs">
    <button class="knowledge-tab active" data-category="all">全部</button>
    <button class="knowledge-tab" data-category="constitution">宪法</button>
    <button class="knowledge-tab" data-category="civil">民法</button>
    <button class="knowledge-tab" data-category="criminal">刑法</button>
    <button class="knowledge-tab" data-category="labor">劳动法</button>
    <button class="knowledge-tab" data-category="marriage">婚姻家庭</button>
    <button class="knowledge-tab" data-category="traffic">交通法</button>
    <button class="knowledge-tab" data-category="consumer">消费者权益</button>
  </div>

  <!-- 搜索统计 -->
  <div id="searchStats" class="search-stats" style="display:none;"></div>

  <!-- 结果区域 -->
  <div id="knowledgeList">
    <div style="text-align:center;padding:var(--space-12);">
      <div class="spinner"></div>
      <p style="font-size:var(--text-sm);color:var(--color-gray-500);margin-top:var(--space-3);">加载中…</p>
    </div>
  </div>

  <!-- 空状态 -->
  <div id="knowledgeEmpty" class="empty-state" style="display:none;">
    <div class="icon">📚</div>
    <div class="title">未找到相关法条</div>
    <div class="desc">尝试修改搜索关键词或切换分类</div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('knowledgeSearch');
  const searchClear = document.getElementById('searchClear');
  const tabs = document.getElementById('knowledgeTabs');
  const listEl = document.getElementById('knowledgeList');
  const emptyEl = document.getElementById('knowledgeEmpty');
  const statsEl = document.getElementById('searchStats');

  let currentCategory = 'all';
  let searchTimeout = null;
  let allDocuments = [];    // 从 RAGFlow 获取的全部文档
  let isLoading = true;

  // ── 高亮关键词 ──
  function highlightText(text, query) {
    if (!query) return escapeHtml(text);
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, 'gi');
    return escapeHtml(text).replace(regex, '<mark class="highlight">$1</mark>');
  }

  // ── 从后端 API 加载 RAGFlow 文档列表 ──
  async function loadDocuments() {
    try {
      const resp = await Api.get('knowledge/documents');
      allDocuments = (resp.data || []).filter(d => d.status === '1');
      console.log(`从 RAGFlow 加载了 ${allDocuments.length} 个文档`);
    } catch (e) {
      console.error('加载文档列表失败:', e);
      allDocuments = [];
    }
    isLoading = false;
    filterAndRender();
  }

  // ── 浏览模式：显示法律列表 ──
  function renderBrowseMode(docs) {
    statsEl.style.display = 'none';
    listEl.innerHTML = '';

    if (docs.length === 0) {
      emptyEl.style.display = 'flex';
      return;
    }
    emptyEl.style.display = 'none';

    docs.forEach(doc => {
      const item = document.createElement('div');
      item.className = 'law-list-item';
      item.innerHTML = `
        <div class="name">${escapeHtml(doc.name)}</div>
        <div class="info">${escapeHtml(doc.year || '日期未知')} · ${doc.chunk_count} 个知识块 · ${doc.token_count} tokens</div>
      `;
      item.addEventListener('click', () => {
        window.location.href = `/knowledge/${doc.id}`;
      });
      listEl.appendChild(item);
    });
  }

  // ── 搜索模式：调用后端 RAGFlow 检索 ──
  async function renderSearchMode(query, category) {
    listEl.innerHTML = '<div style="text-align:center;padding:var(--space-8);"><div class="spinner"></div></div>';
    emptyEl.style.display = 'none';
    statsEl.style.display = 'block';

    try {
      const resp = await Api.get(`knowledge/search?keyword=${encodeURIComponent(query)}&page=1&page_size=20`);
      const data = resp.data || {};
      const items = data.items || [];

      listEl.innerHTML = '';

      if (items.length === 0) {
        emptyEl.style.display = 'flex';
        statsEl.textContent = `未找到与"${escapeHtml(query)}"相关的法条`;
        return;
      }

      statsEl.textContent = `搜索"${escapeHtml(query)}"，找到 ${data.count || items.length} 条结果`;

      // 按法律名称分组
      const grouped = {};
      items.forEach(item => {
        const lawName = item.name || '未知法律';
        if (!grouped[lawName]) {
          grouped[lawName] = { name: lawName, source: item.source || '', matches: [] };
        }
        grouped[lawName].matches.push(item);
      });

      Object.values(grouped).forEach(result => {
        const group = document.createElement('div');
        group.className = 'search-result-group';

        const header = document.createElement('div');
        header.className = 'search-result-group-header';
        header.innerHTML = `
          <span class="law-name">${highlightText(result.name, query)}</span>
          <span class="match-count">${result.matches.length} 条匹配</span>
        `;
        group.appendChild(header);

        result.matches.forEach(match => {
          const item = document.createElement('div');
          item.className = 'search-result-item';
          const content = match.content || '';
          const snippet = content.length > 200 ? content.slice(0, 200) + '…' : content;
          const articleNum = match.article_num ? `第${match.article_num}条` : '';
          item.innerHTML = `
            ${articleNum ? `<div class="article-num">${escapeHtml(articleNum)}</div>` : ''}
            <div class="article-snippet">${highlightText(snippet, query)}</div>
          `;
          group.appendChild(item);
        });

        listEl.appendChild(group);
      });

    } catch (e) {
      listEl.innerHTML = '';
      emptyEl.style.display = 'flex';
      statsEl.textContent = '搜索失败，请稍后重试';
    }
  }

  // ── 主过滤/渲染入口 ──
  async function filterAndRender() {
    const query = searchInput.value.trim().toLowerCase();
    searchClear.style.display = query ? 'block' : 'none';

    if (isLoading) return;

    if (query) {
      await renderSearchMode(query, currentCategory);
    } else {
      let filtered = allDocuments;
      if (currentCategory !== 'all') {
        filtered = filtered.filter(d => d.category === currentCategory);
      }
      renderBrowseMode(filtered);
    }
  }

  // ── 事件监听 ──
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(filterAndRender, 300);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.style.display = 'none';
    filterAndRender();
    searchInput.focus();
  });

  tabs.addEventListener('click', (e) => {
    const tab = e.target.closest('.knowledge-tab');
    if (!tab) return;
    tabs.querySelectorAll('.knowledge-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    filterAndRender();
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      filterAndRender();
    }
  });

  // 初始加载
  loadDocuments();
});
</script>
{% endblock %}
