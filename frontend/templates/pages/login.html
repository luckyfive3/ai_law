{% extends 'base.html' %}
{% block title %}登录/注册 — AI法律助手{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2 id="authTitle">登录</h2>

    <!-- 登录/注册切换 -->
    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active">登录</button>
      <button id="tabRegister" class="auth-tab">注册</button>
    </div>

    <form id="authForm" autocomplete="off">
      <!-- 用户名 -->
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input
          type="text"
          id="username"
          class="input"
          placeholder="请输入用户名"
          maxlength="50"
          autocomplete="off"
        />
        <p class="form-error" id="usernameError" style="display:none;"></p>
      </div>

      <!-- 密码 -->
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input
          type="password"
          id="password"
          class="input"
          placeholder="请输入密码（至少6位）"
          maxlength="100"
          autocomplete="off"
        />
        <p class="form-error" id="passwordError" style="display:none;"></p>
      </div>

      <!-- 确认密码（仅注册模式） -->
      <div class="form-group" id="confirmGroup" style="display:none;">
        <label class="form-label" for="confirmPassword">确认密码</label>
        <input
          type="password"
          id="confirmPassword"
          class="input"
          placeholder="请再次输入密码"
          maxlength="100"
          autocomplete="off"
        />
        <p class="form-error" id="confirmError" style="display:none;"></p>
      </div>

      <!-- 协议勾选 -->
      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="agreeTerms" />
          <span>我已阅读并同意<a href="/disclaimer" target="_blank">《用户协议》</a>和<a href="/disclaimer" target="_blank">《隐私政策》</a></span>
        </label>
        <p class="form-error" id="termsError" style="display:none;"></p>
      </div>

      <!-- 提交按钮 -->
      <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;" disabled>
        登录
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  let mode = 'login'; // 'login' | 'register'

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const confirmGroup = document.getElementById('confirmGroup');
  const agreeCheck = document.getElementById('agreeTerms');
  const submitBtn = document.getElementById('submitBtn');
  const authTitle = document.getElementById('authTitle');
  const form = document.getElementById('authForm');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');

  function switchTab(newMode) {
    mode = newMode;
    if (mode === 'register') {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      authTitle.textContent = '注册';
      submitBtn.textContent = '注册';
      confirmGroup.style.display = '';
    } else {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      authTitle.textContent = '登录';
      submitBtn.textContent = '登录';
      confirmGroup.style.display = 'none';
    }
    updateSubmitBtn();
  }

  tabLogin.addEventListener('click', () => switchTab('login'));
  tabRegister.addEventListener('click', () => switchTab('register'));

  function updateSubmitBtn() {
    const usernameValid = usernameInput.value.trim().length >= 2;
    const passwordValid = passwordInput.value.length >= 6;
    let confirmValid = true;
    if (mode === 'register') {
      confirmValid = confirmInput.value.length >= 6 && confirmInput.value === passwordInput.value;
    }
    const agreed = agreeCheck.checked;
    submitBtn.disabled = !(usernameValid && passwordValid && confirmValid && agreed);
  }

  [usernameInput, passwordInput, confirmInput, agreeCheck].forEach(el => {
    el.addEventListener('input', updateSubmitBtn);
    el.addEventListener('change', updateSubmitBtn);
  });

  // 清除错误提示
  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');
  }

  [usernameInput, passwordInput, confirmInput].forEach(el => {
    el.addEventListener('focus', clearErrors);
  });

  // 表单提交
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    let valid = true;
    if (username.length < 2) {
      document.getElementById('usernameError').textContent = '用户名至少2个字符';
      document.getElementById('usernameError').style.display = 'block';
      valid = false;
    }
    if (password.length < 6) {
      document.getElementById('passwordError').textContent = '密码至少6个字符';
      document.getElementById('passwordError').style.display = 'block';
      valid = false;
    }
    if (mode === 'register') {
      const confirmPwd = confirmInput.value;
      if (confirmPwd.length < 6) {
        document.getElementById('confirmError').textContent = '请确认密码';
        document.getElementById('confirmError').style.display = 'block';
        valid = false;
      } else if (confirmPwd !== password) {
        document.getElementById('confirmError').textContent = '两次输入的密码不一致';
        document.getElementById('confirmError').style.display = 'block';
        valid = false;
      }
    }
    if (!agreeCheck.checked) {
      document.getElementById('termsError').textContent = '请阅读并同意用户协议和隐私政策';
      document.getElementById('termsError').style.display = 'block';
      valid = false;
    }
    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'register' ? '注册中…' : '登录中…';

    try {
      const endpoint = mode === 'register' ? 'auth/register' : 'auth/login';
      const body = mode === 'register'
        ? { username, password, confirm_password: confirmInput.value, agree_terms: true }
        : { username, password, agree_terms: true };

      const resp = await Api.post(endpoint, body);

      if (resp.code === 0 && resp.data) {
        Auth.login(
          resp.data.access_token,
          resp.data.refresh_token,
          resp.data.user
        );
        Toast.success(mode === 'register' ? '注册成功' : '登录成功');

        const redirect = new URLSearchParams(window.location.search).get('redirect');
        setTimeout(() => {
          window.location.href = redirect ? decodeURIComponent(redirect) : '/';
        }, 500);
      } else {
        throw new Error(resp.message || '操作失败');
      }
    } catch (err) {
      Toast.error(err.message || '操作失败，请重试');
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'register' ? '注册' : '登录';
    }
  });
});
</script>
{% endblock %}
