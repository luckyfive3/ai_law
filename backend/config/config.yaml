server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

database:
  host: localhost
  port: 5432
  name: ai_law
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  max_open_conns: 50
  max_idle_conns: 10

redis:
  host: localhost
  port: 6379
  password: ${REDIS_PASSWORD}
  db: 0

jwt:
  secret: ${JWT_SECRET}
  access_ttl: 24h
  refresh_ttl: 168h

llm:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 2048
  timeout: 30s
  max_retries: 3

search:
  base_url: http://search-service:8001
  timeout: 5s
  top_k: 5

safety:
  enable: true
  keywords_file: blocked_keywords.txt

rate_limit:
  messages_per_user_per_minute: 10
  requests_per_ip_per_minute: 30
  burst: 5
