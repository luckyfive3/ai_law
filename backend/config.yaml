# ═══════════════════════════════════════
# AI法律助手 v1.0 — 后端配置
# 阿里云 ECS (Ubuntu) + MongoDB + RAGFlow + LangChain
# 环境变量优先级高于此文件
# ═══════════════════════════════════════

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

mongodb:
  uri: "mongodb://localhost:27017"
  database: ai_law
  max_pool_size: 50
  min_pool_size: 10

jwt:
  secret: "${JWT_SECRET}"
  access_ttl: 24h
  refresh_ttl: 168h

llm:
  provider: deepseek
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 2048
  timeout: 30s
  max_retries: 3

ragflow:
  base_url: "http://ragflow:9380"
  api_key: "${RAGFLOW_API_KEY}"
  dataset_id: "${RAGFLOW_DATASET_ID}"
  top_k: 5
  similarity_threshold: 0.5
  timeout: 10s

safety:
  enable: true
  keywords_file: blocked_keywords.txt

rate_limit:
  messages_per_user_per_minute: 10
  requests_per_ip_per_minute: 30
  burst: 5
